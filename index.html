<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>site</title>
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: black;
        color: white;
        font-family: "Iosevka Term", monospace;
        font-size: 16px;
        white-space: pre;
        transition: opacity 300ms steps(4);
      }

      #loader.done {
        opacity: 0;
        pointer-events: none;
      }

      #loader-bar::before {
        content: "[=       ]";
        animation: loader-bar 1.2s steps(1) infinite;
      }

      @keyframes loader-bar {
        0% {
          content: "[=       ]";
        }
        7% {
          content: "[==      ]";
        }
        14% {
          content: "[ ==     ]";
        }
        21% {
          content: "[  ==    ]";
        }
        28% {
          content: "[   ==   ]";
        }
        35% {
          content: "[    ==  ]";
        }
        42% {
          content: "[     == ]";
        }
        50% {
          content: "[      ==]";
        }
        57% {
          content: "[       =]";
        }
        64% {
          content: "[      ==]";
        }
        71% {
          content: "[     == ]";
        }
        78% {
          content: "[    ==  ]";
        }
        85% {
          content: "[   ==   ]";
        }
        92% {
          content: "[  ==    ]";
        }
        100% {
          content: "[ ==     ]";
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loader-bar::before {
          animation: none;
          content: "[   ==   ]";
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" aria-label="Loading">
      <span id="loader-bar"></span>
      <span>loading...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
